services:
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    ports:
      # Host 444 -> container 443 (HTTPS, snakeoil self-signed)
      - "444:443"
    environment:
      # Connect to the MariaDB running on the Docker host
      PMA_HOST: host.docker.internal
      PMA_PORT: "3306"
      # Default login = root
      PMA_USER: root
      PMA_PASSWORD: "${MYSQL_ROOT_PASSWORD:-}"
      # Only allow connecting to the configured host (no arbitrary servers)
      PMA_ARBITRARY: "0"
      UPLOAD_LIMIT: 256M
    extra_hosts:
      # Makes host.docker.internal resolve to the host on Linux/WSL
      - "host.docker.internal:host-gateway"
    volumes:
      - ./apache-ssl.conf:/etc/apache2/conf-enabled/zz-ssl.conf:ro
    command:
      - bash
      - -c
      - |
        set -e
        # Generate the Debian "snakeoil" self-signed cert if it's not present
        if [ ! -f /etc/ssl/certs/ssl-cert-snakeoil.pem ]; then
          if command -v make-ssl-cert >/dev/null 2>&1; then
            make-ssl-cert generate-default-snakeoil --force-overwrite
          else
            mkdir -p /etc/ssl/private
            openssl req -x509 -nodes -newkey rsa:2048 -days 3650 \
              -keyout /etc/ssl/private/ssl-cert-snakeoil.key \
              -out /etc/ssl/certs/ssl-cert-snakeoil.pem \
              -subj "/CN=$$(hostname)"
            chmod 600 /etc/ssl/private/ssl-cert-snakeoil.key
          fi
        fi
        a2enmod ssl
        exec /docker-entrypoint.sh apache2-foreground
